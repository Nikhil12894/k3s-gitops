apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 91.4.0
    helm:
      valuesObject:
        # Disable k3s embedded control plane services (inaccessible directly)
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        # Kubelet & cAdvisor (Container & Pod CPU/RAM/Network stats)
        kubelet:
          enabled: true
          serviceMonitor:
            https: true

        # Node Exporter (DaemonSet on VPS host: CPU, RAM, NVMe Disk, Network)
        nodeExporter:
          enabled: true

        # Kube-State-Metrics (Pod restarts, Deployments, PVCs)
        kubeStateMetrics:
          enabled: true

        # Prometheus Operator Controller
        prometheusOperator:
          enabled: true

        # Prometheus Server Instance
        prometheus:
          enabled: true
          prometheusSpec:
            externalLabels:
              cluster: "k3s"
            scrapeClasses:
              - name: default
                default: true
                relabelings:
                  - targetLabel: cluster
                    replacement: k3s
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                cpu: 150m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1536Mi

        # Alertmanager (Disabled by default, enable when webhooks/alerts are configured)
        alertmanager:
          enabled: false

        # Grafana Dashboards & UI
        grafana:
          enabled: true
          adminPassword: "admin"
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.explorewithnk.com
            tls:
              - secretName: explorewithnk-grafana-tls
                hosts:
                  - grafana.explorewithnk.com
          defaultDashboardsEnabled: true

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
