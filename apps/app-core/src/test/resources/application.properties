# Disable DevServices if local Docker is unavailable
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.redis.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# In-memory messaging channels for tests
mp.messaging.incoming.task-events-in.connector=smallrye-in-memory
mp.messaging.outgoing.task-events-out.connector=smallrye-in-memory

# Disable external auth and otel in test
quarkus.oidc.enabled=false
quarkus.otel.enabled=false
quarkus.hibernate-orm.active=false
