# HTTP Server Configuration
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.application.name=app-core
quarkus.application.version=1.0.0-SNAPSHOT

# PostgreSQL Datasource Configuration
# Supports both Quarkus env vars and Spring Boot env vars (SPRING_DATASOURCE_URL, etc.)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.default.svc.cluster.local:5432/app_db}
quarkus.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword123}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=5

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Valkey / Redis Configuration
# Compatible with standard Redis protocol on Valkey 8
quarkus.redis.hosts=redis://${SPRING_DATA_REDIS_HOST:valkey.default.svc.cluster.local}:6379
quarkus.redis.timeout=2s

# Apache Kafka (SmallRye Reactive Messaging)
kafka.bootstrap.servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka.default.svc.cluster.local:9092}

# Kafka Outgoing Channel: task-events-out
mp.messaging.outgoing.task-events-out.connector=smallrye-kafka
mp.messaging.outgoing.task-events-out.topic=task-events
mp.messaging.outgoing.task-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Incoming Channel: task-events-in
mp.messaging.incoming.task-events-in.connector=smallrye-kafka
mp.messaging.incoming.task-events-in.topic=task-events
mp.messaging.incoming.task-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.task-events-in.auto.offset.reset=earliest
mp.messaging.incoming.task-events-in.group.id=app-core-consumer-group

# Keycloak OpenID Connect (OIDC) Authentication
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak-app.keycloak.svc.cluster.local:8080/realms/master}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:app-core}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any
quarkus.oidc.connection-delay=5s
quarkus.oidc.connection-retry-count=3

# HTTP Security Policy Definitions
quarkus.http.auth.permission.public.paths=/api/public/*,/api/tasks/*,/api/tasks,/actuator/*,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.secured.paths=/api/secure/*
quarkus.http.auth.permission.secured.policy=authenticated

# OpenTelemetry Distributed Tracing (Exports to OTEL Collector -> Rootprint UI & Quickwit)
quarkus.otel.enabled=true
quarkus.otel.service.name=app-core
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.default.svc.cluster.local:4317}
quarkus.otel.exporter.otlp.traces.protocol=grpc

# Prometheus Metrics Registry (Micrometer)
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# SmallRye Health (Liveness & Readiness probes)
quarkus.smallrye-health.root-path=/q/health

# Native Executable Compilation Settings
quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces
