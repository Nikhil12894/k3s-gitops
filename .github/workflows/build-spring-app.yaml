name: Build and Push Spring App

on:
  push:
    paths:
      - 'apps/spring-app/**'
      - '.github/workflows/build-spring-app.yaml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Spring App Image
        uses: docker/build-push-action@v6
        with:
          context: apps/spring-app
          file: apps/spring-app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/spring-app-argo:latest
            ghcr.io/${{ env.REPO_OWNER_LC }}/spring-app-argo:${{ github.sha }}
