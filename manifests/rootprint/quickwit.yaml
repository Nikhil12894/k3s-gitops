apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quickwit-pvc
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickwit
  template:
    metadata:
      labels:
        app: quickwit
    spec:
      containers:
        - name: quickwit
          image: quickwit/quickwit:v0.9.0
          args: ["run"]
          env:
            - name: QW_S3_FLAVOR
              value: "minio"
            - name: QW_S3_ENDPOINT
              value: "http://minio.default.svc.cluster.local:9000"
            - name: QW_S3_FORCE_PATH_STYLE_ACCESS
              value: "true"
            - name: AWS_REGION
              value: "us-east-1"
            - name: QW_DEFAULT_INDEX_ROOT_URI
              value: "s3://quickwit-indexes"
            - name: QW_METASTORE_URI
              value: "s3://quickwit-metastore"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: root-password
          ports:
            - name: rest
              containerPort: 7280
            - name: grpc
              containerPort: 7281
          volumeMounts:
            - name: qwdata
              mountPath: /quickwit/qwdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            tcpSocket:
              port: 7280
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7280
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: qwdata
          persistentVolumeClaim:
            claimName: quickwit-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quickwit
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 7280
      targetPort: 7280
    - name: grpc
      port: 7281
      targetPort: 7281
  selector:
    app: quickwit
