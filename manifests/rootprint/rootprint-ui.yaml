apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootprint-ui
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rootprint-ui
  template:
    metadata:
      labels:
        app: rootprint-ui
    spec:
      containers:
        - name: rootprint-ui
          image: ghcr.io/rootprint/rootprint:latest
          env:
            - name: DATABASE_URL
              value: "postgres://rootprint:rootprint@postgresql.default.svc.cluster.local:5432/rootprint"
            - name: QUICKWIT_URL
              value: "http://quickwit.default.svc.cluster.local:7280"
            - name: ORIGIN
              value: "https://rootprint.explorewithnk.com"
          ports:
            - name: http
              containerPort: 8282
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8282
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8282
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rootprint-ui
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8282
    - name: http-alt
      port: 8282
      targetPort: 8282
  selector:
    app: rootprint-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rootprint-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rootprint.explorewithnk.com
      secretName: explorewithnk-rootprint-tls
  rules:
    - host: rootprint.explorewithnk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rootprint-ui
                port:
                  number: 80
