apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  init.sql: |
    CREATE DATABASE bitnami_keycloak;
    CREATE USER bn_keycloak1 WITH ENCRYPTED PASSWORD 'bn_keycloak1';
    GRANT ALL PRIVILEGES ON DATABASE bitnami_keycloak TO bn_keycloak1;
    ALTER DATABASE bitnami_keycloak OWNER TO bn_keycloak1;
    CREATE DATABASE rootprint;
    CREATE USER rootprint WITH ENCRYPTED PASSWORD 'rootprint';
    GRANT ALL PRIVILEGES ON DATABASE rootprint TO rootprint;
    ALTER DATABASE rootprint OWNER TO rootprint;
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secrets
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgrespassword123"
  KEYCLOAK_DB_PASSWORD: "bn_keycloak1"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "app_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - name: postgresql
              containerPort: 5432
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d app_db
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d app_db
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: postgresql
