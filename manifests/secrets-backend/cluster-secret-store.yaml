apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: explorewithnk-vault-cert
  namespace: cert-manager
spec:
  secretName: vaultwarden-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: vault.explorewithnk.com
  dnsNames:
    - vault.explorewithnk.com

