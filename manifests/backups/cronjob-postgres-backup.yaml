apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-s3-backup
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: amazon/aws-cli:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  DUMP_FILE="/tmp/postgres_backup_${TIMESTAMP}.sql.gz"

                  echo "Installing postgresql client..."
                  dnf install -y postgresql16 gzip || dnf install -y postgresql15 gzip

                  echo "Dumping PostgreSQL databases..."
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall -h postgresql.default.svc.cluster.local -U postgres | gzip > "$DUMP_FILE"

                  echo "Syncing dump to MinIO S3..."
                  aws --endpoint-url "$S3_ENDPOINT" s3 cp "$DUMP_FILE" "s3://${S3_BUCKET}/postgres/pg_all_${TIMESTAMP}.sql.gz"

                  echo "Backup successfully written to MinIO."
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-db-secrets
                      key: POSTGRES_PASSWORD
                - name: S3_ENDPOINT
                  value: "http://minio.default.svc.cluster.local:9000"
                - name: S3_BUCKET
                  value: "homelab-backups"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: root-password
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
